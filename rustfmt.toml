# src/rys_tab.rs is generated by tools/gen_rys_tab.py: ~6.7k lines of
# piecewise-Chebyshev coefficient tables emitted as long array literals.
# rustfmt wraps those literals one element per line, which inflates the file
# to ~40k lines and makes it diverge from what the generator emits - so every
# regeneration would show up as a ~33k-line diff. Nothing reads this file by
# hand, so leave it exactly as generated.
ignore = ["src/rys_tab.rs"]
