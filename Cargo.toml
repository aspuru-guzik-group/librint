[package]
name = "librint"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2.155"
faer = "0.19.0"
# already in the tree as a faer dependency; used directly by src/par.rs for
# work-stealing over shell pairs
rayon = "1.11"

[profile.dev]
#debug = true
opt-level = 0
debug-assertions = true
lto = "fat"
debug = 0

[profile.release]
lto = "fat"
debug = 0
#rustflags = ["-Z", "autodiff=Enable"]

[lib]
# cdylib only: autodiff needs fat LTO, which cargo won't apply to a cdylib+rlib mix
crate-type = ["cdylib"]
name = "rint"

# Enzyme-reverse cost profiler (needs the rlib/name flip above; the SLURM job
# slurm/ssubmit_prof.sh does the flip on a /tmp copy of the tree)
#[[bin]]
#name = "prof_dtwo"
#path = "checks/prof_dtwo.rs"

# Harness-free nuc test runner (cargo test x Enzyme broken on this nightly, see checks/nuc_bin.rs).
# To run: set crate-type = ["rlib"] and name = "librint" above, then
#   RUSTFLAGS="-Z autodiff=Enable,LooseTypes" cargo run --release --bin nuc_check
# (bins can't link a cdylib-only lib; revert to ["cdylib"] + "rint" for the .so)
# Diagnostic for the fused-Enzyme gradient bug (needs the rlib/name flip above)
#[[bin]]
#name = "diag_denergy"
#path = "checks/diag_denergy.rs"

#[[bin]]
#name = "all_checks"
#path = "checks/all_bin.rs"

#[[bin]]
#name = "nuc_check"
#path = "checks/nuc_bin.rs"

#[[bin]]
#name = "int"
#path = "primal/integral.rs"

#[[bin]]
#name = "dint"
#path = "enzyme/integral.rs"

# [[bin]]
# name = "simple"
# path = "tests/simple.rs"
#
# [[bin]]
# name = "contracted"
# path = "tests/contracted.rs"

[[test]]
name = "ovlp"
path = "checks/overlap.rs"

[[test]]
name = "nuc"
path = "checks/nuclear.rs"

[[test]]
name = "kin"
path = "checks/kinetic.rs"

[[test]]
name = "two"
path = "checks/twoelec.rs"

[[test]]
name = "energy"
path = "checks/energy.rs"
