[package]
name = "librint"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2.155"

[profile.dev]
#debug = true
opt-level = 0
debug-assertions = true
lto = "fat"
debug = 0

[profile.profiling]
inherits = "dev"
opt-level = 1
debug = true

[profile.release]
lto = "fat"
debug = 0
#rustflags = ["-Z", "autodiff=Enable"]

# [lib]
# crate-type = ["cdylib"]

[[bin]]
name = "overhead"
path = "overhead/overhead.rs"

[[bin]]
name = "dint"
path = "enzyme/integral.rs"
